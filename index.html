
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>预约跳转页面</title>
  <script>
    window.onload = function () {
      // 从 cookie 中读取参数
      const token = document.cookie.match(/token=([^;]+)/)?.[1];
      const openId = document.cookie.match(/openId=([^;]+)/)?.[1];
      const sheduid = new URLSearchParams(location.search).get("sheduid") || "67864";
      const hdid = new URLSearchParams(location.search).get("hdid") || "22";

      if (token && openId) {
        const target = `https://weixin.snhm.org.cn/ziran_wei_html/yuyue_ju.html?hdid=${hdid}&openid=${openId}`;
        window.location.href = target;
      } else {
        document.body.innerHTML = "<h2>⚠️ 未检测到登录信息，请先通过微信访问官网登录后再点击此链接。</h2>";
      }
    };
  </script>
</head>
<body>
  <p>加载中，请稍候...</p>
</body>
</html>
